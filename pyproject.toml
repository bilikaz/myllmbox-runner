[project]
name = "myllmbox-runner"
version = "0.1.0"
description = "The myllmbox box runner: vLLM container + cloudflared tunnel + keepalive auth proxy"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "pyyaml>=6.0", "click>=8.1", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-aiohttp>=1.0", "pytest-asyncio>=0.23"]

[project.scripts]
mbx-runner = "mbx_runner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
