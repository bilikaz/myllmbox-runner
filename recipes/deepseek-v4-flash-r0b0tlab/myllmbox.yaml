# DeepSeek-V4-Flash-0731 via r0b0tlab's v0.26.0 SM121 image — a REFERENCE build to A/B against our own
# (recipes/deepseek-v4-flash-0731) and the anemll one. https://github.com/r0b0tlab/DeepSeek-V4-Flash-DSpark-v026-SM121
# Robot's distinctive config: NATIVE regular cudagraphs + FULL_DECODE_ONLY, torch.compile OFF (mode 0),
# flashinfer_b12x MoE, nvfp4_ds_mla KV, dspark K6. Prebuilt GHCR image, pinned by digest (a reference, not our
# own from-source build — per house rule). We drive `vllm` ourselves (override entrypoint) so it runs under our
# runner (cluster launch + proxy + tunnel) instead of robot's run-dspark-dual-gb10.sh launcher.
#
# DUAL-NODE: 304B MoE across BOTH Sparks (TP=2, set automatically from cluster.boxes). Needs both Sparks free.

server:
  image: ghcr.io/r0b0tlab/deepseek-v4-flash-dspark-v026-sm121:v0.26.0-sm121-native-v11   # pinned build @sha256:ef852781efd6278cb3d908a4298874fb8b34fe84f0e1a03181ed415ec233a9d4 (tag → visible in `docker images`, removable)
  entrypoint: vllm                               # image default is robot's launcher; override → `vllm serve`
  model: /models/deepseek-ai/DeepSeek-V4-Flash-0731
  # PERSISTENT KERNEL CACHE → /cache (mounted on BOTH nodes; each Spark keeps its own compiled kernels). THIS is
  # why the mHC/TileLang compile storm is a one-time cost: the flashinfer topk256 + mHC TileLang kernels compile
  # ONCE and are reused every boot. We drive `vllm` bare, so without this every boot recompiled from cold
  # (~250-size warmup → the OOM/stall). Lives in the recipe's gitignored .data/ (one place for all generated junk).
  cache: recipes/deepseek-v4-flash-r0b0tlab/.data/cache   # host → /cache; env below points the caches under it

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "0"
    VLLM_USE_AOT_COMPILE: "0"                     # robot's env
    VLLM_USE_BREAKABLE_CUDAGRAPH: "0"             # REQUIRED by his image (validates 0/1); native regular cudagraphs = 0
    VLLM_DISABLE_COMPILE_CACHE: "0"              # cache ENABLED (robot's default) — pairs with the /cache mount above
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "1800"
    # point the kernel/artifact caches under the persistent /cache mount so compiled flashinfer/mHC-TileLang
    # kernels + vLLM artifacts survive container recreation → the compile storm is a ONE-TIME cost.
    # (No HF_HOME — we're fully offline with a local /models path; the HF hub cache is never touched.)
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    VLLM_CACHE_ROOT: /cache/vllm-cache
    # THE big one: the mHC warmup's TileLang kernels. TileLang reads TILELANG_CACHE_DIR (kernel_cache.py) and
    # DEFAULTS to ~/.tilelang/cache = /root/.tilelang/cache — INSIDE the ephemeral container, so the ~250-size
    # compile storm evaporated every boot. Point it under the persistent /cache mount → compiled ONCE, then reused.
    TILELANG_CACHE_DIR: /cache/tilelang
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    # b12x MoE weight-LOADER path (anemll has these; robot didn't). Without VLLM_USE_B12X_MOE the MoE falls back
    # to the default FusedMoE loader = per-expert `expert_data.copy_` in a Python loop → one core pegged ~90%,
    # the other TP rank waits → the shard-10 load LIVELOCK. This routes loading through b12x's batched loader.
    VLLM_USE_B12X_MOE: "1"
    VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"      # b12x W4A16 MoE kernel block config (anemll's proven values)
    VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
    # NCCL over RoCE/ConnectX — the PROVEN config from our 0731/anemll recipes on THIS cluster. Robot's own
    # NCCL_NET=IB + partial RoCE env was tuned for his hardware and fails "invalid usage" here. The runner also
    # pins NCCL_IB_HCA / NCCL_SOCKET_IFNAME / VLLM_HOST_IP per box from cluster.yaml.
    NCCL_IB_GID_INDEX: "3"
    NCCL_IB_ROCE_VERSION_NUM: "2"
    NCCL_IB_ADDR_FAMILY: "AF_INET"
    NCCL_CROSS_NIC: "1"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_NVLS_ENABLE: "0"

  vllm:
    served-model-name: deepseek-ai/DeepSeek-V4-Flash   # same served name as our other DS recipes → one client, A/B
    trust-remote-code: true
    pipeline-parallel-size: 1
    distributed-executor-backend: mp             # dual-node = mp; TP=2 set by the launcher from cluster.boxes
    gpu-memory-utilization: 0.75      # WARM-BOOT VALUE (cache now populated → no host-side compile → no RAM spike,
                                      # so we can hand more of the UMA pool to KV). COLD boot needed 0.75 to leave
                                      # ~31G for the TileLang compilers (0.835 → UMA OOM). Now that /cache/tilelang
                                      # is warm (3 kernels, both nodes) that spike is gone → 0.80 is safe, and 0.83
                                      # if we want more KV. (Never above ~0.83 on these UMA boxes — house rule.)
    kv-cache-dtype: nvfp4_ds_mla
    block-size: 256
    max-model-len: 30000
    max-num-seqs: 6
    # 12288 (was 16384). The mHC warmup RUNS its kernels (a forward pass) at every token size up to this value.
    # Even with a WARM cache (no compile), the 16384-token warmup activation (~32 GiB) on top of weights (79.6)
    # + KV (14.1 at 0.83) overflowed the 125.5 GiB UMA pool → OOM during warmup. 12288 shrinks that peak to
    # ~24 GiB → fits with margin. This is now our production batch ceiling (mHC tunes rebuild once for ≤12288).
    max-num-batched-tokens: 8192
    moe-backend: flashinfer_b12x
    enable-flashinfer-autotune: true
    enable-prefix-caching: true
    tokenizer-mode: deepseek_v4
    tool-call-parser: deepseek_v4
    enable-auto-tool-choice: true
    reasoning-parser: deepseek_v4
    speculative-config: '{"method":"dspark","num_speculative_tokens":6}'    # robot's "K6"
    reasoning-config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
    default-chat-template-kwargs: '{"thinking":true}'
    # robot's native-cudagraph profile: regular (not breakable) FULL_DECODE_ONLY, torch.compile off (mode 0)
    compilation-config: '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_implementation":"regular","cudagraph_strict":true}'
    optimization-level: 2                         # robot's image flags (its patched vLLM understands them)
    performance-mode: balanced
    jit-monitor-mode: error
    # our house default: recommended sampling, NO penalty (penalties corrupt JSON/tool-calls — see other DS recipes)
    override-generation-config: '{"temperature":0.6,"top_p":0.95}'

cluster:
  boxes: [box1, box2]                            # resolved from cluster.yaml; box 0 = head. TP=2 auto.
  master_port: 25000

dashboard: sparkdash                             # mia → dashboards/sparkdash/. Proxy fronts it on non-/v1 paths,
                                                 # gated by DASHBOARD_PASSWORD (.env). Shows both Sparks + tok/s.
