# DeepSeek-V4-Flash — the B12X-optimized serving stack on 2× DGX Spark (GB10/SM121).
#
# This is the FAST path: the B12X fork (moe/linear/attention all on B12X kernels + B12X_MLA_SPARSE + dspark
# spec) instead of the Marlin fallback our older recipes/deepseek-v4-flash-0731 uses. Ported from the upstream
# eugr recipe (bilikaz/spark-vllm-docker main, "Updated DSV4F 0731") into our recipes/ structure + cluster
# wiring. Built to A/B against the Marlin serve — see recipes/deepseek-v4-flash-0731 for the Marlin baseline.
#
# ⚠ NEEDS THE B12X IMAGE — mbx-deepseek-v4-flash is built from this recipe's Dockerfile (the --exp-b12x build).
#   Marlin flags won't work here and B12X flags won't work on the Marlin image; the two are separate builds.
#
# DUAL-NODE: 304B MoE, TP=2 across the ConnectX-7 link (mp, no Ray). The cluster: block launches head here +
# a --headless worker on box2. Weights local → offline.

server:
  image: mbx-deepseek-v4-flash
  model: /models/deepseek-ai/DeepSeek-V4-Flash-0731
  # PERSISTENT KERNEL CACHE → /cache (mounted on BOTH nodes; each Spark keeps its own compiled kernels). The b12x
  # mHC path compiles TileLang kernels (hc_head_fuse/mhc_post) + AOT graphs on a COLD boot — a ~31G UMA spike that
  # recurs every launch and starves KV (the r0b0tlab TileLang saga: cold-compile OOM). Point the caches under this
  # persistent /cache → compiled ONCE, reused every boot → no spike, faster boot, and headroom to raise util.
  cache: recipes/deepseek-v4-flash/.data/cache

  env:
    # ---- B12X stack (the real speedup; must match the B12X image's expectations) ----
    CUTE_DSL_ARCH: "sm_121a"
    VLLM_USE_AOT_COMPILE: "1"
    VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
    VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
    VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
    VLLM_USE_FLASHINFER_SAMPLER: "1"
    VLLM_USE_B12X_WO_PROJECTION: "1"
    VLLM_USE_B12X_MHC: "1"
    VLLM_USE_B12X_FP8_GEMM: "1"
    VLLM_USE_B12X_MOE: "1"
    VLLM_USE_B12X_SPARSE_INDEXER: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    B12X_MLA_SM120_UNIFIED: "1"
    B12X_MOE_FORCE_A8: "1"
    # ---- offline + arch ----
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    # ---- persistent kernel/compile caches (point under the /cache mount above → compile storm is ONE-TIME) ----
    VLLM_DISABLE_COMPILE_CACHE: "0"                  # cache ENABLED (pairs with the /cache mount)
    VLLM_CACHE_ROOT: /cache/vllm-cache               # AOT torch.compile + vLLM artifacts (log showed /root/.cache/vllm)
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    TILELANG_CACHE_DIR: /cache/tilelang              # THE big one — mHC TileLang kernels (else ~31G cold-compile/boot)
    # ---- RoCE NCCL over ConnectX (launcher sets IFNAME/HCA/DISABLE; these pin RoCE v2) ----
    NCCL_IB_GID_INDEX: "3"
    NCCL_IB_ROCE_VERSION_NUM: "2"
    NCCL_IB_ADDR_FAMILY: "AF_INET"
    NCCL_CROSS_NIC: "1"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_NVLS_ENABLE: "0"

  vllm:
    gpu-memory-utilization: 0.85                 # upstream's B12X value — start conservative, tune up after A/B
    served-model-name: deepseek-ai/DeepSeek-V4-Flash
    trust-remote-code: true
    pipeline-parallel-size: 1
    distributed-executor-backend: mp             # dual-node = mp (no Ray); TP set by the launcher
    kv-cache-dtype: fp8_ds_mla                   # DS-V4 sparse MLA's native packed KV. The b12x fork resolves a
                                                 # plain 'fp8' to THIS at runtime anyway (log: "Using DeepSeek's
                                                 # fp8_ds_mla KV cache format") — eugr's recipe left the generic fp8.
    block-size: 256
    max-model-len: 300000                        # 1M-monster capped at 300k per policy
    max-num-seqs: 8
    max-num-batched-tokens: 8192
    enable-prefix-caching: true
    # ---- B12X backends (the whole point — needs the --exp-b12x image) ----
    moe-backend: b12x
    linear-backend: b12x
    attention-backend: B12X_MLA_SPARSE
    load-format: instanttensor                   # B12X hybrid draft loader (built into the image)
    max-cudagraph-capture-size: 64
    # NB: vLLM warns "torch.compile ... does not support it" for DS-V4, but AOT compile DOES run + cache
    # (VLLM_USE_AOT_COMPILE=1; ~18s first boot) and BOTH PIECEWISE and FULL cudagraphs capture — the warning is
    # cosmetic (model not on the official supported list). Kept as upstream's validated value.
    compilation-config: '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
    speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}'
    # ---- DeepSeek-V4 parsers + thinking (house default ON) ----
    tokenizer-mode: deepseek_v4
    tool-call-parser: deepseek_v4
    enable-auto-tool-choice: true
    reasoning-parser: deepseek_v4
    reasoning-config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}'
    default-chat-template-kwargs: '{"thinking":true,"reasoning_effort":"high"}'
    generation-config: vllm
    # house sampling defaults (client overrides per-param). temp 0.6 = DeepSeek's anti-loop; NO rep/freq/presence
    # penalty (corrupts JSON/code/tool-calls). Don't send temperature:0 on this model.
    override-generation-config: '{"temperature":0.6,"top_p":0.95}'

cluster:                                         # TP=2 across both Sparks over the ConnectX-7 link
  boxes: [box1, box2]                            # names → cluster.yaml (portable, no IPs). box 0 = head (API).
  master_port: 25000

dashboard: sparkdash                             # proxy fronts non-/v1, gated by DASHBOARD_PASSWORD
