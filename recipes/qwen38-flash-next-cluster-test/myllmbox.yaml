# Qwen3.8-Flash-Next CLUSTER TEST LANE (2026-09-05): the champion at TP=2 over RDMA with the PLE n-gram table
# re-quantized to NVFP4 and RESIDENT ON THE GPUs (row-sharded, 14.4 GiB/box) — no CPU offload worker, no IPC.
# Differences vs ../qwen38-flash-next-cluster (the K=4 reference lane):
#   model  → …-hibrid46-ple4 (same 19 body shards HARDLINKED + 8 new NVFP4 table shards; make-ple-nvfp4.py)
#   image  → mbx-qwen38-flash-next-cluster-test (v1 + patch 02: GPU-resident NVFP4 gather)
#   env    → VLLM_PLE_CPU_OFFLOAD and MBX_PLE_MULTINODE REMOVED (the table is an ordinary sharded parameter now)
#   util   → 0.86 (PROPOSAL, see below): the 18 GiB worker is gone from the box, the 14.4 GiB partition moved INTO
#            the GPU process, so the process needs a bigger slice of the same memory. Net box usage −3.6 GiB.
# Everything else identical (K=4, seqs 64, kv 46G) so the A/B isolates the table change:
#   steps/s (engine), c=1..64 ladder via bench/test.py, and bench/logprob.py (bf16 table vs int3 vs NVFP4).
#
# FIRST: build the checkpoint (one-time, ~30-60 min, runs on a serving box — user runs it):
#   docker run --rm -v $PWD/models:/models -v $PWD/recipes/qwen38-flash-next-cluster-test/docker/make-ple-nvfp4.py:/x.py:ro \
#     --entrypoint python3 myllmbox/qwen38-flash-next-vllm:v1 /x.py \
#     --int3 /models/myllmbox/Qwen3.8-Flash-Next-hibrid46 --bf16 /models/myllmbox/Qwen3.8-Flash-Next-hibrid46-off \
#     --dst /models/myllmbox/Qwen3.8-Flash-Next-hibrid46-ple4
# THEN (both boxes free):  ./run.sh qwen38-flash-next-cluster-test   (rsyncs the new dir to box2: hardlinks travel as files)

server:
  image: mbx-qwen38-flash-next-cluster-test
  cpuset: "5-9,15-19"
  entrypoint: vllm
  model: /models/myllmbox/Qwen3.8-Flash-Next-hibrid46-ple4
  cache: recipes/qwen38-flash-next-cluster-test/.data/cache
  min_avail_gb: 100                             # wait for unified memory after a teardown (phantom OOM otherwise)

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    # NO VLLM_PLE_CPU_OFFLOAD, NO MBX_PLE_MULTINODE — the whole point of this lane.
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    VLLM_CACHE_ROOT: /cache/vllm-cache
    OMP_NUM_THREADS: "8"
    MBX_VOCAB_GEMV: "1"
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    NCCL_IB_GID_INDEX: "3"
    NCCL_IB_ROCE_VERSION_NUM: "2"
    NCCL_IB_ADDR_FAMILY: "AF_INET"
    NCCL_CROSS_NIC: "1"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_CUMEM_ENABLE: "0"
    NCCL_NVLS_ENABLE: "0"

  vllm:
    served-model-name: Qwen/Qwen3.8-Flash-Next
    pipeline-parallel-size: 1
    distributed-executor-backend: mp
    gpu-memory-utilization: 0.86                  # PROPOSAL: 0.86 × 119.7 = 103 GiB for the GPU process =
                                                  # 38 body + 14.4 table + ~2.5 act/graphs + 46 KV = 101. The
                                                  # reference lane runs 0.70 + an 18 GiB worker OUTSIDE the
                                                  # process = the same ~102 GiB box footprint. If the first boot
                                                  # reports "Available KV" < 46 GiB, lower kv-cache-memory, not util.
    kv-cache-memory: "46000000000"                # same pool as the reference lane (A/B parity)
    max-model-len: 262144
    async-scheduling: true
    max-num-seqs: 64
    max-num-batched-tokens: 8192
    enable-prefix-caching: true
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":4}'

cluster:
  boxes: [box1, box2]
  master_port: 25000

dashboard: sparkdash
