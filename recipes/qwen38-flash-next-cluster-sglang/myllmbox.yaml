# Qwen3.8-Flash-Next — DUAL SGLANG (DRAFT, PARKED 2026-08-29, user: "no plans for dual"): MiaAI's
# 64.4 tok/s single-stream / 117 aggregate config, rebuilt as a myllmbox recipe.
#
# REALITY CHECK (2026-08-29 late, third-party X leaderboard, honest sustained CODE decode): this exact
# class of config ("Qwen3.8-Flash-Next SGLang TP2") measured **~30 tok/s** by an independent GB10
# tester who explicitly calls the 47-70 headlines "cherry-picked" — i.e. dual sglang loses to our
# SOLO vLLM hibrid (44-46 sustained code). The 60+ framing below is Mia's headline, kept for
# provenance; treat ~30-35 as the realistic sustained expectation if this is ever booted. The only
# 45+ code configs known on GB10: our solo hibrid (44-46, ONE box) and GLM-5.3 TP4 four-box (48-51).
#
# PREREQUISITES (check before first ./run.sh):
#   1. BOTH boxes free (this takes the cluster; box1 = hibrid champion, box2 = golden — user decides).
#   2. Weights on box2 at the SAME path — run.sh rsyncs models/RadixArk/... (126G over the LAN, one-time).
#   3. ./build-and-copy.sh qwen38-flash-next-cluster-sglang (builds on head, ships image to box2).
#
# KNOWN RISKS (from her runbook, unproven on OUR pair):
#   - NCCL: her image bundles 2.29.7; her GLM runbook pins >= 2.30.7 for CUDA graphs + TP on GB10+CX7
#     (she LD_PRELOADs a host-staged libnccl 2.30.7 on both nodes). If dual graph capture hangs after
#     NCCL init, that pin is suspect #1 — we'd need the same staging or a newer base image.
#   - Her QSA numerics history: pasture gate on OUR boot before believing anything (see solo-sglang).
#   - QSA indexer prefill workspace (fp32 [chunk x history]) wedged her boxes — chunk stays 1024 here
#     (her dual value at 0.80; we run native ctx so pressure is lower, but dual has less slack too).
#
# QUALITY GATE MANDATORY, then judge by steps/s (= gen / accept len) and per-stream tok/s at c=1,2,4.
# Her measured targets: 64.4 single stream / 116.8 aggregate @ c=2 / 114.1 @ c=4 (TTFT 117/169/517ms).

cluster:
  boxes: [box1, box2]                           # head = box1 (API); TP=2 set automatically

server:
  image: mbx-qwen38-flash-next-cluster-sglang   # built from THIS folder's Dockerfile
  model: /models/RadixArk/Qwen3.8-Flash-Next-NVFP4
  cache: recipes/qwen38-flash-next-cluster-sglang/.data/cache   # own lane: JIT caches per node
  cpuset: "5-9,15-19"                           # GB10 performance cores (her pin; runner --cpuset-cpus)

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    TRITON_CACHE_DIR: /cache/triton
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    OMP_NUM_THREADS: "10"                       # matches the 10-core pin (more threads = thrash)
    MBX_PLE_MMAP: "1"                           # PLE from disk — never disable (house rule). Dual note:
                                                # her config PINS the 26G/node fp8 table shard in host RAM
                                                # (inside 0.80); our mmap adoption zero-copies it from the
                                                # checkpoint on NVMe instead -> that RAM goes to KV.
    MBX_STRIP_SPEC_BREAKERS: "1"                # logprobs/top_logprobs silently disable NEXTN (patch 6)

  sglang:
    served-model-name: Qwen/Qwen3.8-Flash-Next
    trust-remote-code: true
    quantization: modelopt_fp4
    attention-backend: flashinfer
    fp4-gemm-backend: flashinfer_cutlass
    page-size: 64
    context-length: 262144                      # native (house policy caps 1M monsters at 300k; her 1M
                                                # YaRN default is the documented follow-up experiment)
    mem-fraction-static: 0.80                   # HER value — PLE budget note is issue #8 in her repo;
                                                # with our mmap table this may have headroom to raise LATER
    chunked-prefill-size: 1024                  # her dual value; indexer workspace wedge protection
    max-running-requests: 12                    # start below her 28 (we test c=1..6 first; raise with the
                                                # decode-graph list once stable)
    speculative-algorithm: NEXTN
    speculative-num-steps: 3                    # her validated 3/1/4 chain
    speculative-eagle-topk: 1
    speculative-num-draft-tokens: 4
    kv-cache-dtype: nvfp4                       # DUAL pick: capacity for many streams (~3.1x tokens,
                                                # her NIAH-clean-to-128k patch); solo lane prefers bf16
    num-continuous-decode-steps: 2
    mamba-ssm-dtype: bfloat16
    mamba-radix-cache-strategy: extra_buffer
    mamba-track-interval: 64
    disable-prefill-cuda-graph: true            # SM121 house rule
    disable-cuda-graph-padding: true
    sampling-backend: pytorch
    reasoning-parser: auto
    tool-call-parser: auto

dashboard: sparkdash
