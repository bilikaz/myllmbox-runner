# Qwen3.8-Flash-Next — SINGLE Spark via vLLM, Inferact NVFP4, PLE-from-disk. THE PROVEN CONFIG
# (2026-08-27, first fully-healthy serve of this model here): 16.3 tok/s single-stream spec-off,
# 1500-token thinking generations with zero corruption, ~924k-1.24M-token KV pool on ONE box.
# vLLM ships working SM121 kernels for this model (own QSA triton kernels — no community patch needed);
# our Dockerfile adds ONE patch: the PLE table is served from an (unlinked) NVMe file in the CPU offload
# worker instead of resident RAM (MBX_PLE_MMAP=1) — without it 95G of table + 73G of weights can't share
# a 119G box. NOTE --distributed-executor-backend mp is LOAD-BEARING: the PLE offload worker is only
# spawned on the multiproc executor path; uniproc (TP1 default) never spawns it and the first request
# busy-hangs forever (upstream gap, measured).
#
# MTP spec decode: PROVEN 2026-08-27 on box2 — vLLM's dedicated Qwen3_8FlashNextMTP draft impl loads
# Inferact's nvfp4 MTP head (sglang can't) and ACCEPTS: draft acceptance 63-64.5%, mean accept length
# 2.9/4, per-position 0.74/0.63/0.52 → 22.0 tok/s vs 16.3 spec-off (+35%), clean 1500-token thinking
# generations. Tuning headroom: K=2 may trade a little accept length for less draft overhead.

server:
  image: mbx-qwen38-flash-next-solo-vllm        # built from THIS folder's Dockerfile (keep in sync with
                                                # recipes/qwen38-flash-next/Dockerfile — same content)
  entrypoint: vllm
  model: /models/Inferact/Qwen3.8-Flash-Next-NVFP4
  cache: recipes/qwen38-flash-next-solo-vllm/.data/cache   # /cache: torch-compile + triton caches + the PLE backing file

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    VLLM_PLE_CPU_OFFLOAD: "1"                   # table → CPU offload worker (single-node only upstream)
    MBX_PLE_MMAP: "1"                           # …and from there to NVMe via our patch. Never disable (house rule).
    MBX_PLE_MMAP_TAG: "inferact-nvfp4"          # PERSISTENT table: first boot writes the 95G once (+ .ok marker),
                                                # every later boot mmaps it and skips the copy — fast boots, no NVMe
                                                # wear. Tag names the checkpoint: CHANGE IT if model: changes, or
                                                # rm .data/cache/ple-mmap/* to reset.
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace   # flashinfer JIT workspace
    VLLM_CACHE_ROOT: /cache/vllm-cache          # the ACTUAL autotune-result store (flashinfer_autotune_cache/
                                                # ...autotune_configs.json — boot log said "0 from previous"
                                                # while saving under ephemeral /root/.cache/vllm) + vLLM's own
                                                # compile cache. Without this every boot re-tunes from scratch.
    OMP_NUM_THREADS: "15"                       # vLLM cuts serving procs to 1 torch thread ("Reducing Torch
                                                # threads from 20 to 1 ... Set OMP_NUM_THREADS to override").
                                                # 15 measured ~+5% step rate vs 10 (drafted-throughput A/B).
                                                # The CPU-side PLE worker does K+1 gathers per MTP verify step —
                                                # single-threaded that serializes inside the spec cycle. 4 of the
                                                # 20 Grace cores for it; raise if gathers still show as the drag.

  vllm:
    served-model-name: Qwen/Qwen3.8-Flash-Next
    tensor-parallel-size: 1
    distributed-executor-backend: mp            # REQUIRED — see header (PLE worker spawn gap on uniproc)
    gpu-memory-utilization: 0.85                # explicit (yaml was riding vLLM's 0.90 default) — leaves real
                                                # headroom for PLE page cache + autotune workspaces + OS
    kv-cache-memory: "21474836480"              # 20 GiB pin (trimmed from 30 — RAM pressure) ≈ 830k tokens,
                                                # still >3 full-262k-context streams
    max-model-len: 262144
    # kv-cache-dtype: fp8   # REJECTED by the model, both engines (measured 2026-08-27): vLLM raises
    #                        # "Qwen3.8-Flash-Next QSA requires a BF16 main KV cache" at init; sglang's CuTe
    #                        # path asserted the same incompatibility. bf16 KV is architectural here.
    async-scheduling: false                     # auto-ON with MTP in this build, but upstream-confirmed UNFIXED bug
                                                # (PR #53896): async sched + MTP feeds -1/0 placeholders into
                                                # _prepare_ngram_context -> wrong PLE n-gram context ~every decode
                                                # step (silent quality + accept-rate loss). Re-enable when fixed.
    max-num-seqs: 6
    max-num-batched-tokens: 16384               # VLM ≥16k house rule
    enable-prefix-caching: true
    # no-enable-flashinfer-autotune: true   # OFF (autotune ENABLED) since 2026-08-27: the disable came from
    #                                       # the official multi-GPU commands; solo/1-GPU we let FlashInfer
    #                                       # tune its kernels at warmup (adds warmup time; artifacts persist
    #                                       # under /cache). Re-add the flag if warmup crashes on SM121.
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml                 # per the updated official recipe page (was qwen3_coder)
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":2}'   # K=2 SETTLED (A/B 2026-08-27 on the autotuned stack): K=2 23.3-23.4 vs K=3 20.8-22.9 warm HTML; K=3's third draft accepts only ~0.16 (single MTP layer reused K times — decay is architectural)

dashboard: sparkdash
