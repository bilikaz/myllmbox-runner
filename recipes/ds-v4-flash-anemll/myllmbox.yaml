# ds-v4-flash-anemll — TEST: does anemll's dspark image serve DS-V4-Flash-0731 WITH dspark on our cluster?
# Reference point before we build our own 0.26 image. anemll's NATIVE config: flashinfer_b12x MoE + b12x env
# + dspark speculation ON. If this serves, 0.25/0.26 has the dspark decode → our 0.26 build will too.
# If it hits the same sparse-decode assert, the vLLM version isn't the cause (suspect arch 12.0 vs 12.1a).

server:
  image: ghcr.io/anemll/dspark-vllm-gx10:0.1.1   # anemll's prebuilt — already on BOTH nodes (fast revive, no copy)
  entrypoint: vllm                               # (its default entrypoint is already `vllm serve`)
  model: /models/deepseek-ai/DeepSeek-V4-Flash-0731

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    VLLM_USE_FLASHINFER_SAMPLER: "1"
    VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
    VLLM_USE_B12X_MOE: "1"                        # anemll's b12x MoE (this image HAS it)
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
    VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
    VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    CUTE_DSL_ARCH: "sm_121a"
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    DG_JIT_USE_NVRTC: "0"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    NCCL_IB_GID_INDEX: "3"
    NCCL_IB_ROCE_VERSION_NUM: "2"
    NCCL_IB_ADDR_FAMILY: "AF_INET"
    NCCL_CROSS_NIC: "1"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_NVLS_ENABLE: "0"

  vllm:
    gpu-memory-utilization: 0.85
    served-model-name: deepseek-ai/DeepSeek-V4-Flash
    trust-remote-code: true
    pipeline-parallel-size: 1
    distributed-executor-backend: mp
    kv-cache-dtype: nvfp4_ds_mla                 # jvr0x's original 4-bit DS-MLA KV — faithful reference, to compare vs fp8_ds_mla
    block-size: 256
    max-model-len: 300000
    max-num-seqs: 6
    max-num-batched-tokens: 8192
    max-cudagraph-capture-size: 36
    moe-backend: flashinfer_b12x                 # anemll's native MXFP4 MoE
    enable-flashinfer-autotune: true
    enable-prefix-caching: true
    enable-chunked-prefill: true
    async-scheduling: true
    tokenizer-mode: deepseek_v4
    tool-call-parser: deepseek_v4
    enable-auto-tool-choice: true
    reasoning-parser: deepseek_v4
    speculative-config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
    reasoning-config: '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
    default-chat-template-kwargs: '{"thinking":false}'
    generation-config: vllm

cluster:
  boxes: [box1, box2]                  # resolved from cluster.yaml (host/interconnect/iface/ib_hca/ssh_user);
                                       # box 0 = head. No machine IPs here — portable. Set up via cluster/setup.sh.
  master_port: 25000
