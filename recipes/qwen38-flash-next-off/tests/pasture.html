<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#cdeaf7}
svg#stage{position:fixed;inset:0;display:block;width:100vw;height:100vh}
.hud{position:fixed;top:clamp(14px,3.2vh,32px);left:clamp(16px,3vw,42px);z-index:5;pointer-events:none;color:#16362a;text-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 22px rgba(255,255,255,.45)}
.kick{font:600 10.5px/1 system-ui,-apple-system,"Segoe UI",Avenir,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#2c6b45}
h1{margin:.3em 0 .16em;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,ui-serif,serif;font-weight:400;font-size:clamp(34px,5.4vw,74px);line-height:.86;letter-spacing:-.022em}

.sub{margin:0;max-width:26ch;font:italic 400 clamp(12.5px,1.15vw,16px)/1.45 "Iowan Old Style",Georgia,ui-serif,serif;color:#264c39}
.chips{position:fixed;left:clamp(16px,3vw,42px);bottom:clamp(14px,3vh,32px);z-index:5;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border:1px solid rgba(22,54,42,.16);border-radius:999px;background:rgba(255,255,255,.74);color:#173a29;font:600 11px/1 system-ui,-apple-system,"Segoe UI",Avenir,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.chip:hover{transform:translateY(-3px);background:#fff;box-shadow:0 8px 18px rgba(21,60,40,.18)}
.log{position:fixed;right:clamp(16px,3vw,42px);bottom:clamp(14px,3vh,32px);z-index:5;pointer-events:none;text-align:right;display:grid;gap:5px}
.log div{font:500 10px/1.3 system-ui,-apple-system,"Segoe UI",Avenir,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#1e4b34;opacity:.62;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.hit{fill:#fff;fill-opacity:0;pointer-events:all;cursor:pointer}
.tag{opacity:0;transition:.35s ease;pointer-events:none;text-anchor:middle;font:600 16px system-ui,-apple-system,"Segoe UI",Avenir,sans-serif;letter-spacing:.1em;fill:#16362a;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:6px;transform-box:fill-box;transform:translateY(7px)}
.animal{transition:opacity .4s}
.body{transition:filter .35s}
#fa:hover .animal{opacity:.55}

.animal:hover .body,.animal.spot .body{filter:drop-shadow(0 4px 10px rgba(255,255,255,.8)) drop-shadow(0 0 20px rgba(255,255,255,.7))}
.animal:hover .tag,.animal.spot .tag{opacity:1;transform:translateY(0)}
.bounce{transform-box:fill-box;transform-origin:50% 100%;animation:hop .9s infinite;will-change:transform}
.b-sheep{animation-duration:.74s;animation-delay:-.42s}
.b-pig{animation-duration:.82s;animation-delay:-.7s}
.b-cow{animation-duration:.9s;animation-delay:-.18s}
.b-horse{animation-duration:1s;animation-delay:-.6s}

.lite{transform-box:fill-box;transform-origin:50% 0;animation:hop .3s ease-in-out infinite}
@keyframes lite{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
.shadow{fill:#1d4423;opacity:.3;transform-box:fill-box;transform-origin:center;animation:sh .9s infinite}
.animal#a-sheep .shadow{animation-duration:.74s;animation-delay:-.42s}
.animal#a-pig .shadow{animation-duration:.82s;animation-delay:-.7s}
.animal#a-cow .shadow{animation-duration:.9s;animation-delay:-.18s}
.animal#a-horse .shadow{animation-duration:1s;animation-delay:-.6s}
@keyframes sh{0%{transform:scale(1);opacity:.3}28%{transform:scale(.84);opacity:.16}50%{transform:scale(1.05);opacity:.32}62%,100%{transform:scale(1);opacity:.3}}
.ear{transform-box:fill-box;transform-origin:50% 90%;animation:wig 2.6s ease-in-out infinite}
.ear.e2{animation-delay:-1.3s}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.swish{transform-box:fill-box;transform-origin:50% 4%;animation:sw 2.2s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(8deg)}}
.cloud{animation:drift linear infinite;will-change:transform}
.c1{animation-duration:64s;animation-delay:-10s}.c2{animation-duration:82s;animation-delay:-38s}
.c3{animation-duration:96s;animation-delay:-60s}.c4{animation-duration:110s;animation-delay:-25s}
.c5{animation-duration:120s;animation-delay:-95s}
@keyframes drift{from{transform:translateX(-460px)}to{transform:translateX(1680px)}}
.halo{transform-box:view-box;transform-origin:1330px 150px;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway ease-in-out infinite alternate}
.t1{animation-duration:6.2s}.t2{animation-duration:7.6s;animation-delay:-2.4s}.t3{animation-duration:5.4s;animation-delay:-1.2s}
@keyframes sway{from{transform:rotate(-1.15deg)}to{transform:rotate(1.15deg)}}
.bird{animation:glide linear infinite}
@keyframes glide{from{transform:translate(-160px,0)}to{transform:translate(1780px,0)}}
.bird .w{transform-box:fill-box;transform-origin:center;animation:flap .42s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.28)}}
.fly{animation:flit 21s ease-in-out infinite}
@keyframes flit{0%{transform:translate(1130px,720px)}20%{transform:translate(1240px,648px)}45%{transform:translate(1372px,676px)}70%{transform:translate(1290px,752px)}100%{transform:translate(1130px,720px)}}
.fly .wg{transform-box:fill-box;transform-origin:center;animation:beat .2s ease-in-out infinite alternate}
@keyframes beat{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="log"><div>Sun — 12 rays, turning</div><div>Clouds — 5, drifting east</div><div>Bounce — 0.74s to 1.00s</div></div>

<script>
(function(){
var NS="http://www.w3.org/2000/svg";
function mk(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
var seed=20240607;
function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}

/* sun rays */
var R=document.getElementById("rays");
for(var i=0;i<12;i++)mk("path",{d:"M-7-64L7-64L0-108Z",transform:"rotate("+(i*30)+")"},R);
for(i=0;i<12;i++)mk("path",{d:"M-3.5-66L3.5-66L0-92Z",transform:"rotate("+(i*30+15)+")",opacity:".5"},R);

/* fence posts */
var F=document.getElementById("fenceG");
for(var x=34;x<1620;x+=118){
 mk("rect",{x:x-5,y:542,width:10,height:62,rx:2.5,fill:"#9a7350"},F);
 mk("rect",{x:x-5,y:542,width:3.5,height:62,fill:"#bb946c"},F);
 mk("circle",{cx:x,cy:539,r:4.5,fill:"#a8805c"},F);
}

/* bushes + hill brush */
var B=document.getElementById("bushG"),HB=document.getElementById("hbsh");
for(i=0;i<9;i++)mk("use",{href:"#bsh",transform:"translate("+(60+i*184+rnd()*60)+","+(590+rnd()*12)+") scale("+(.5+rnd()*.45)+")",opacity:String(.85+rnd()*.15)},B);
for(i=0;i<11;i++)mk("circle",{cx:60+i*146+rnd()*50,cy:528+rnd()*30,r:8+rnd()*9,fill:"#7fae7d",opacity:".55"},HB);

/* flowers */
var FL=document.getElementById("flwG"),pet=["#fffaf0","#ffffff","#fff3f6","#fdfbf0"];
for(i=0;i<20;i++){
 var fx=30+rnd()*1550,fy=612+rnd()*258,s=.55+(fy-585)/380;
 var g=mk("g",{transform:"translate("+fx.toFixed(1)+","+fy.toFixed(1)+") scale("+s.toFixed(2)+")"},FL);
 mk("path",{d:"M0 0v-11",stroke:"#3f7f3c","stroke-width":"2",fill:"none","stroke-linecap":"round"},g);
 for(var j=0;j<5;j++){var a=j/5*6.2832;mk("circle",{cx:(Math.cos(a)*4.2).toFixed(1),cy:(-11+Math.sin(a)*4.2).toFixed(1),r:3,fill:pet[i%4]},g);}
 mk("circle",{cx:0,cy:-11,r:2.2,fill:i%3?"#ffce4a":"#f7b93e"},g);
}

/* horse mane */
var M=document.getElementById("maneG"),pts=[[134,-156],[146,-172],[157,-186],[166,-198],[174,-210]];
for(i=0;i<pts.length-1;i++){
 var x1=pts[i][0],y1=pts[i][1],x2=pts[i+1][0],y2=pts[i+1][1],dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy),nx=dy/L,ny=-dx/L,mx=(x1+x2)/2,my=(y1+y2)/2;
 mk("path",{d:"M"+x1+" "+y1+"L"+x2+" "+y2+"L"+(mx+nx*15).toFixed(1)+" "+(my+ny*15).toFixed(1)+"Z"},M);
 mk("path",{d:"M"+(x1+2)+" "+(y1+3)+"L"+(x2-1)+" "+(y2+3)+"L"+(mx+nx*7).toFixed(1)+" "+(my+ny*7).toFixed(1)+"Z",fill:"#6b4227"},M);
}
mk("path",{d:"M176-214l-6-14 13 6Z"},M);

/* foreground tufts */
var T=document.getElementById("tuftG");
for(i=0;i<46;i++){
 var tx=rnd()*1620,ty=838+rnd()*58,h=16+rnd()*24;
 mk("path",{d:"M"+tx.toFixed(0)+" "+ty.toFixed(0)+"q"+(rnd()*7-3.5).toFixed(1)+" "+(-h/2).toFixed(0)+" "+(rnd()*8-4).toFixed(1)+" "+(-h).toFixed(0),
  stroke:"#2e6836",opacity:(.35+rnd()*.4).toFixed(2),"stroke-width":"3","stroke-linecap":"round",fill:"none"},T);
}

/* chip highlighting */
var all=[].slice.call(document.querySelectorAll(".animal")),fa=document.getElementById("fa");
function focus(id){fa.classList.toggle("focus",!!id);all.forEach(function(a){a.classList.toggle("spot",a.id===id);});}
[].slice.call(document.querySelectorAll(".chip")).forEach(function(c){
 c.addEventListener("mouseenter",function(){focus(c.getAttribute("data-t"));});
 c.addEventListener("focus",function(){focus(c.getAttribute("data-t"));});
 c.addEventListener("mouseleave",function(){focus(null);});
 c.addEventListener("blur",function(){focus(null);});
 c.addEventListener("click",function(){focus(c.getAttribute("data-t"));});
});
})();
</script>
