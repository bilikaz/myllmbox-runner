# Qwen3.8-Flash-Next — THE PUBLISHED STACK v2: hibrid47, TP=2 ACROSS BOTH SPARKS over RDMA (2026-09-06).
# hibrid47 = hibrid46's body + the PLE n-gram table re-quantized to NVFP4 and held RESIDENT ON THE GPU (patch 03 in
# the Dockerfile; MBX_PLE_REPLICATE=1 = the full table on each box, no per-step exchange). No CPU offload worker,
# no IPC detour. Measured against the int3/offload stack, same boxes, same tests, same day: engine steps +8–11 % on
# every rung (c=1 17.7 vs 16.4; c=32 4.0 vs 3.7), 80 tok/s single-stream peak (76 avg), 533 @ c=32; boss-animals
# render gauntlet 26/32 vs ~16/32. README.md / reports.md. Public twin of this image: …-cluster-vllm:v3.
#
# HOST RULE (root, once, both boxes; cluster/server-profile.sh sets it): vm.compaction_proactiveness=0. Without it a
# tight serve stalls 4–5 s every ~37 s (kcompactd migrating GPU-mapped pages) — −10 % and a 30 % floor drop.
#
# PREREQUISITES: BOTH boxes free. Weights: /models/myllmbox/Qwen3.8-Flash-Next-hibrid47 on both boxes (run.sh rsyncs;
# 98.9 GiB, 27 shards — 19 body shards are hibrid46's, hardlink them if hibrid46 is already there).
#
#   ./run.sh qwen38-flash-next-cluster

server:
  image: mbx-qwen38-flash-next-cluster
  cpuset: "5-9,15-19"
  entrypoint: vllm
  model: /models/myllmbox/Qwen3.8-Flash-Next-hibrid47
  cache: recipes/qwen38-flash-next-cluster/.data/cache
  min_avail_gb: 100                             # wait for unified memory after a teardown (phantom OOM otherwise)

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    # NO VLLM_PLE_CPU_OFFLOAD / MBX_PLE_MULTINODE: the NVFP4 table is an ordinary GPU parameter (patch 03).
    MBX_PLE_REPLICATE: "1"                        # full 28.6 GiB table on each box, no all-reduce — the measured layout.
                                                  # Unset = half per box (14 GiB freed → kv pin up to 40 G, ~80 seats;
                                                  # c=1 steps within 1 %) — measure before publishing numbers from it.
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    VLLM_CACHE_ROOT: /cache/vllm-cache
    OMP_NUM_THREADS: "8"
    MBX_VOCAB_GEMV: "1"
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    NCCL_IB_GID_INDEX: "3"
    NCCL_IB_ROCE_VERSION_NUM: "2"
    NCCL_IB_ADDR_FAMILY: "AF_INET"
    NCCL_CROSS_NIC: "1"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_CUMEM_ENABLE: "0"
    NCCL_NVLS_ENABLE: "0"

  vllm:
    served-model-name: Qwen/Qwen3.8-Flash-Next
    pipeline-parallel-size: 1
    distributed-executor-backend: mp
    gpu-memory-utilization: 0.7                   # with kv-cache-memory pinned this does not size the KV pool
                                                  # (verified 2026-09-06: 65 GiB of weights + the pin boot at 0.70)
    kv-cache-memory: "28000000000"                # 28 GB/box = 1.71M pooled tokens, ~55 seats at 1.15 %/request.
                                                  # After capture: ~5 GB available/box, box2 touched swap (3 GB) on the
                                                  # first boot — 25 G (1.52M tokens, 49 seats) is the no-swap setting.
    max-model-len: 262144
    async-scheduling: true
    max-num-seqs: 48                              # the graph bucket below the pool's ~55 seats
    max-num-batched-tokens: 8192
    enable-prefix-caching: true
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":4}'

cluster:
  boxes: [box1, box2]
  master_port: 25000

dashboard: sparkdash
