# Qwen3.8-Flash-Next — THE PUBLISHED STACK (2026-09-01): hibrid46 + in-checkpoint int3 PLE.
# This recipe serves EXACTLY what the world gets:
#   weights = hf.co/myllmbox/Qwen3.8-Flash-Next-hibrid46  (91G: 4.6-bit hibrid, PLE table shipped
#             pre-quantized int3 as ordinary checkpoint tensors, declared in config.json)
#   image   = docker.io/myllmbox/qwen38-flash-next-vllm:v1  (vendor base + the ple_layer patch;
#             reproducible from builds/qwen38-flash-next/ — ledger + digest in vllm-v1.md there)
# Self-describing checkpoint: no conversion, no bank, no quant pass, no MBX_PLE env — first boot
# loads the table from the shards (resident, ~19.2G in the offload worker) and serves in ~15 min.
# Lineage: hibrid45 champion (renamed ../qwen38-flash-next-off, the offload/bank-era stack) ->
# hibrid46 test lane (../qwen38-flash-next-test, the lab) -> THIS. Scoreboard (single Spark, K=3,
# thinking-off code band): c=1 44 / c=2 72 / c=4 103 / c=8 148-158 peak 167.5 aggregate tok/s.
# async-scheduling stays FALSE: async+MTP on this backend corrupted ~2 of 8 concurrent outputs
# (2026-09-01 gauntlets). KV stays bf16 (vendor QSA guard refuses fp8).
#
# Fresh box:  ./download.sh myllmbox/Qwen3.8-Flash-Next-hibrid46   (then point model: below at it)
# Our head box already holds the same bytes at models/export/ (the upload source).

server:
  image: myllmbox/qwen38-flash-next-vllm:v1     # pinned public tag, pushed 2026-09-02
                                                # digest: sha256:92ccd7de6d80b9597844d7a5bffb9ded4067dd323129e18bc24192c00dac09ad
  entrypoint: vllm                              # plain `vllm serve` — the checkpoint is final
  model: /models/myllmbox/Qwen3.8-Flash-Next-hibrid46   # == the HF repo id (./download.sh lands here).
                                                # PENDING MOVE (blocked on the running upload): bytes
                                                # currently at models/export/...-hf; the full-fat local
                                                # conversion at this path renames to ...-hibrid46-off
                                                # first (the bf16-table reference lane's checkpoint).
  cache: recipes/qwen38-flash-next/.data/cache

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    VLLM_PLE_CPU_OFFLOAD: "1"                   # the vendor's own offload switch — the only PLE knob
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    VLLM_CACHE_ROOT: /cache/vllm-cache
    OMP_NUM_THREADS: "18"
    MBX_VOCAB_GEMV: "1"                         # championship-proven (+5.5% steps)
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"             # Marlin small-N fast path (self-gating)

  vllm:
    served-model-name: Qwen/Qwen3.8-Flash-Next
    tensor-parallel-size: 1
    distributed-executor-backend: mp            # REQUIRED — PLE worker spawn gap on uniproc
    gpu-memory-utilization: 0.70
    kv-cache-memory: "18000000000"              # 18 GB = 579,550 KV tokens (measured)
    max-model-len: 262144
    async-scheduling: false                     # SHIPPING CONFIG — see header; lab rung only
    max-num-seqs: 8
    max-num-batched-tokens: 8192                # also the image encoder budget: realistic multi-
                                                # screenshot requests ~2k tokens, one max-res ~4.1k;
                                                # two untouched max-res (~8.2k) is the first wedge
    enable-prefix-caching: true                 # WATCH ITEM: mamba/GDN prefix-cache alignment bug
                                                # reported by peer recipe (Saren) — under investigation;
                                                # flip false if cached-prefix outputs degrade
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":3}'   # K=3 (K=4 = next A/B)

dashboard: sparkdash
