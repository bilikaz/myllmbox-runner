# Qwen3.8-Flash-Next HIBRID46 — ===== TEST LANE (2026-08-31): the next-generation stack =====
# hibrid46 = a REAL reconversion (make-hibrid46.sh -> Qwen3.8-Flash-Next-hibrid46, hibrid45 untouched):
#   checkpoint: shared expert BACK to bf16 (~0.4% steps for unmeasured risk — and Alibaba's own FP8
#               release excludes it too); GDN stays nvfp4 (~3.5% steps, A/B-validated). "4.6 bits".
#   serve-time: PLE table int3 (persisted+mmapped, MBX_PLE_QBITS) + KV cache fp8 (doubles the pool).
# Graduates to the champion recipe as ONE stack once the formal gauntlet + paired A/B pass.
# Copy of the champion recipe with ONE experiment: the 95.4G bf16 n-gram/PLE table quantized to
# MBX_PLE_QBITS bits (group-64 asymmetric) RESIDENT in the CPU offload worker, gathers dequanting
# on read — the bf16 mmap bank is never touched after the one quantization pass, so the ~200MB/s
# NVMe paging that throttles c>=3 disappears. KV dropped 25G -> 12G to make room.
# LADDER (high->low, stop where quality breaks): bf16 champion = measured top rung; int3 (~19.2G)
# = rung 1; int2 (~14.9G) only if int3 holds; int4 (~26.9G, KV<=6G) = diagnostic. PLE feeds the
# MAIN forward (Alibaba excluded it from quant): judge = gauntlet + paired A/B, not acceptance.
# Champion recipe untouched.
# Inferact NVFP4 experts + OUR NVFP4 dense EXCEPT attention (QSA q/k/v/o untouched bf16), solo box.
#
# THE PRECISION MAP (why this split — measured, not guessed):
#   experts                       nvfp4 (Inferact)  the bulk; tolerant
#   GDN in/out + shared expert    nvfp4 (OURS)      0.97+0.11 GiB/step — multiplicative, tolerant
#   QSA q/k/v/o                   bf16 SACRED       comparators: q.k dot products RANK tokens; 4-bit
#                                                   noise flips rankings (hibrid4 lesson) and even
#                                                   fp8 cost acceptance — bf16 BEAT the fp8 champion
#                                                   on the paired prose A/B (2.55-3.04 vs 1.81-2.30)
#   lm_head/embeds/MTP/PLE/norms  bf16              quality-critical set (Alibaba's own exclusions)
#
# SCOREBOARD (single Spark, K=3):
#   hibrid45 (THIS):   13.2-13.6 steps/s, code 50-52 (peak 51.6+), prose accept 2.5-3.0 (beats fp8's
#                      1.8-2.3 same-prompt); pasture-passed, "near identical to pre-compression".
#   hibrid4 (retired): all-nvfp4 dense = 13.8 steps, PEAK 53.5 / 70.5 c=2 aggregate — intermittent
#                      IQ drop (pasture defects, prose floor 2.08). Speed record only; do not serve.
#   fp8 hibrid (old):  12.8 steps, code 46-50, peak 50.0 — superseded (this folder's git history).
# Experiment trail: experiments/qwen38-flash-next-solo-test (uncommitted lane).
#
# OUT OF THE BOX — ONE command does everything (image build -> source download if absent ->
# checkpoint conversion -> serve; later boots fast-skip all of it):
#   ./run.sh qwen38-flash-next-test
# (hibrid45 checkpoint + the 95G PLE bank already exist from the champion — this lane reuses both
# via the shared cache path below; first boot pays only the one-time int2 quantization pass.)
# The image also carries MBX_INDEX_STRICT (default on): hardlinked hibrid checkpoints leave stale
# originals in the old shards and vLLM iterates FILES, not the index — packed 4-bit weights
# shape-assert on the stale bf16 copies without it (the fp8 era survived only by shard sort order).

server:
  image: mbx-qwen38-flash-next-test # built from THIS folder's Dockerfile (champion + int2-PLE patch)
  entrypoint: /opt/mbx/serve-entry.sh           # first-boot self-conversion, then exec vllm serve
  model: /models/myllmbox/Qwen3.8-Flash-Next-hibrid46
  cache: recipes/qwen38-flash-next-test/.data/cache   # shared: SAME PLE table bytes (hardlinked
                                                # shards) -> same tag reuses the banked 95G table

  env:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    HF_HUB_DISABLE_XET: "1"
    VLLM_PLE_CPU_OFFLOAD: "1"
    MBX_PLE_MMAP: "1"                           # never disable (house rule)
    MBX_PLE_MMAP_TAG: "inferact-nvfp4"          # table bytes identical to Inferact (hardlinks) — reuse bank
    MBX_PLE_QBITS: "3"                          # THE EXPERIMENT (ladder, high->low): quantize the PLE table
                                                # to N bits (group-64 asymmetric) RESIDENT at first gather;
                                                # dequant on read; the bf16 mmap bank never pages again.
                                                # Rung 1 = int3 (~19.2G, highest width that fits at KV 12G).
                                                # bf16 champion = the measured top rung; descend to "2"
                                                # (~14.9G) only if int3 matches it on quality. "4" (~26.9G)
                                                # = diagnostic rung, needs KV <= ~6G. MBX_PLE_QBITS_GROUP overrides.
    TORCH_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_CUDA_ARCH_LIST: "12.1a"
    FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
    VLLM_CACHE_ROOT: /cache/vllm-cache
    OMP_NUM_THREADS: "18"
    MBX_VOCAB_GEMV: "1"                         # championship-proven on the fp8 hibrid (+5.5% steps)
    VLLM_MARLIN_USE_ATOMIC_ADD: "1"             # Marlin small-N fast path (its own warmup hint; also
                                                # used in our DS-V4 MoE stack). Self-gating: only fires
                                                # when n<2048 & k>=2048 & m*n small — i.e. the narrow
                                                # shared-expert/fused fp4 GEMMs; big GEMMs untouched.

  vllm:
    served-model-name: Qwen/Qwen3.8-Flash-Next
    tensor-parallel-size: 1
    distributed-executor-backend: mp            # REQUIRED — PLE worker spawn gap on uniproc
    gpu-memory-utilization: 0.75
    kv-cache-memory: "16000000000"              # TEST: 16 GB (bytes) — vs champion's 25G; the int3 PLE
                                                # table (~19G, persisted+mmapped) took the difference.
                                                # At fp8 KV below: ~1M tokens (bf16 would be ~500k).
    # kv-cache-dtype: fp8  — RUNG CLOSED 2026-08-31: boot refused with
    #   NotImplementedError: "Qwen3.8-Flash-Next QSA requires a BF16 main KV cache" (qsa.py guard).
    # Vendor policy, both engines (sglang asserted the same in its CuTe fallback). KV stays bf16
    # on this architecture — capacity comes from the KV/table RAM split, not dtype.
    #max-model-len: 262144
    max-model-len: 131072
    async-scheduling: false                     # unfixed async+MTP n-gram bug (PR #53896)
    max-num-seqs: 8
    max-num-batched-tokens: 16384
    enable-prefix-caching: true
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":3}'   # K=3 (champion setting)

# run.sh model pipeline: missing /models/myllmbox/* -> quantize.sh -> this recipe-local converter
# (source downloaded first if absent).
quantize:
  source: /models/Inferact/Qwen3.8-Flash-Next-NVFP4
  script: make-hibrid46.sh
  out: /models/myllmbox/Qwen3.8-Flash-Next-hibrid46

dashboard: sparkdash
